image:
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Image repository.
  repository: registry.k8s.io/kwok/kwok
  # -- Overrides the image tag whose default is {{ .Chart.AppVersion }}.
  tag: ""

# -- Image pull secrets.
imagePullSecrets: []

# -- Override the `name` of the chart.
nameOverride: ""

# -- Override the `fullname` of the chart.
fullnameOverride: "kwok-controller"

# -- Annotations added to the kwok pod.
podAnnotations: {}
# -- Labels added to the kwok pod.
podLabels: {}

podSecurityContext: {}
securityContext: {}

nodeSelector: {}
resources: {}
affinity: {}

# -- The replica count for Deployment. Without `leaderElection.enabled` it
# must be `0` or `1`, since every replica would run the controllers.
replicas: 1

# -- The Deployment update strategy. `Recreate` stops the old pod before the
# new one starts, so two controllers never run at once during an upgrade.
# `RollingUpdate` is safe once `leaderElection.enabled` is true.
strategy:
  type: Recreate

leaderElection:
  # -- Run kwok with leader election, so several replicas can run with only
  # one active. The lease lives in the release namespace. The Service also
  # routes to standbys, which answer only health checks, so scrape metrics
  # from the leader pod.
  enabled: false

# -- Change `hostNetwork` to `true` if you want to deploy in a kind cluster.
hostNetwork: false
tolerations:
- operator: Exists
  effect: NoSchedule
  key: node-role.kubernetes.io/control-plane
- operator: Exists
  effect: NoSchedule
  key: node-role.kubernetes.io/master
volumes: []
env:
- name: POD_IP
  valueFrom:
    fieldRef:
      fieldPath: status.podIP
- name: HOST_IP
  valueFrom:
    fieldRef:
      fieldPath: status.hostIP
volumeMounts: []
enableDeployment: true

# -- Overrides merged into the default KwokConfiguration from `conf/kwok.yaml`, for example
# `options.manageAllNodes: true`. Lists, such as `enableCRDs`, replace the default.
# Changing it restarts the kwok pod.
config: {}
